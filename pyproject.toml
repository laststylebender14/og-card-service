[project]
name = "og-card-service"
version = "0.1.0"
description = "Fast, idiomatic Python service for generating GitHub Open Graph social preview cards with FastAPI and Pillow"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "laststylebender14", email = "ran.mahadik14@gmail.com" },
]
dependencies = [
    "cachetools>=5.4.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numerize>=0.12",
    "pillow>=10.4.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
og-card-service = "og_card_service.cli:main"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
